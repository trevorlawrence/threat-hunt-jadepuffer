name: Build Threat Hunt PDF

on:
  push:
    branches: [main]

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-dejavu

      - name: Prepare report Markdown
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          readme = Path('README.md').read_text(encoding='utf-8')

          # Convert repository HTML image tags to Markdown images so Pandoc
          # embeds the screenshots and hero image in the PDF.
          readme = re.sub(
              r'<img\s+src="([^"]+)"\s+alt="([^"]*)"(?:\s+width="[^"]*")?\s*/?>',
              lambda m: f'![{m.group(2)}]({m.group(1)})',
              readme,
              flags=re.I,
          )

          # Give fenced KQL/code blocks a restrained blue appearance and
          # light background so queries are visually distinct from narrative text.
          header = r'''\usepackage{xcolor}
          \usepackage{fvextra}
          \definecolor{kqlcolor}{HTML}{24527A}
          \definecolor{kqlbg}{HTML}{F4F7FA}
          \DefineVerbatimEnvironment{verbatim}{Verbatim}{formatcom=\color{kqlcolor},fontsize=\small,breaklines=true,breakanywhere=true}
          \DefineVerbatimEnvironment{Highlighting}{Verbatim}{formatcom=\color{kqlcolor},fontsize=\small,breaklines=true,breakanywhere=true}
          \usepackage{framed}
          '''

          # Put the MITRE evidence table on a dedicated landscape page. This
          # prevents the final rows from being stranded or split across pages.
          marker = 'The following techniques were identified from the evidence collected during the investigation:'
          if marker in readme:
              readme = readme.replace(
                  marker,
                  marker + '\n\n\\newpage\n\\begin{landscape}\n\\footnotesize\n',
                  1,
              )

          conclusion_marker = '# 10. Conclusion'
          if conclusion_marker in readme:
              readme = readme.replace(
                  conclusion_marker,
                  '\\normalsize\n\\end{landscape}\n\n' + conclusion_marker,
                  1,
              )

          front = f'''---
          title: "Threat Hunt: JadePuffer"
          subtitle: "A Threat Hunting Case Study on an AI-Driven Intrusion"
          author: "Trevor L. Pulliam"
          date: "September 2026"
          toc: true
          toc-depth: 2
          geometry: margin=0.75in
          fontsize: 10pt
          colorlinks: true
          linkcolor: black
          urlcolor: black
          header-includes:
            - |
              {header}
          ---

          '''
          Path('report.md').write_text(front + readme, encoding='utf-8')
          PY

      - name: Build PDF
        run: |
          pandoc report.md \
            --from=gfm \
            --pdf-engine=xelatex \
            --output=Threat-Hunt-JadePuffer.pdf \
            --resource-path=. \
            -V mainfont="DejaVu Sans" \
            -V monofont="DejaVu Sans Mono" \
            -V colorlinks=true

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: threat-hunt-jadepuffer-pdf
          path: Threat-Hunt-JadePuffer.pdf
          retention-days: 7
